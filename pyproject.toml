[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ftcsim"
version = "0.1.0"
description = "Desktop FTC SDK simulator and project setup wizard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9,<4", "rich>=13,<15"]
license = "LicenseRef-FTC-SDK"
license-files = ["sdk/LICENSE"]

[project.scripts]
ftcsim = "ftcsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ftcsim = ["ds/*.html", "templates/*.txt", "sdk/libs/*.jar", "sdk/*.json", "sdk/LICENSE"]
