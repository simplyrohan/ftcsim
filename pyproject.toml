[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ftcsim"
dynamic = ["version"]
description = "Desktop FTC SDK simulator and project setup wizard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9,<4", "rich>=13,<15"]
license = "GPL-3.0-only AND LicenseRef-FTC-SDK"
license-files = ["LICENSE", "sdk/LICENSE"]

[project.scripts]
ftcsim = "ftcsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "ftcsim.__version__"}

[tool.setuptools.package-data]
ftcsim = ["web/*", "web/licenses/*", "web/models/*", "web/draco/*", "web/_app/*", "web/_app/immutable/*/*", "templates/*.txt", "sdk/libs/*.jar", "sdk/*.json", "sdk/LICENSE"]
