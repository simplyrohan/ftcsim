plugins { id 'java' }
apply from: rootProject.file('gradle/jvm-dependencies.gradle')
configurations { kotlinCompiler }
configurations.sdkLibraries.exclude group: 'androidx.core'
configurations.sdkLibraries.exclude group: 'androidx.annotation'
dependencies {
    implementation project(':runtime')
    implementation libraryJars
    sdkLibraries 'com.pedropathing:revhub:3.0.2'
    sdkLibraries 'org.solverslib:core:0.3.6'
    sdkLibraries 'com.bylazar:configurables:1.0.3'
    kotlinCompiler 'org.jetbrains.kotlin:kotlin-compiler-embeddable:2.3.21'
}
java { sourceCompatibility = JavaVersion.VERSION_11; targetCompatibility = JavaVersion.VERSION_11 }
tasks.named('compileJava') { options.release = 11 }
sourceSets.main.java.srcDir('TeamCode/src/main/java')
sourceSets.main.java.exclude('**/pedro/Tuning.java', '**/pedro/procedures/**')
def kotlinFiles = fileTree('TeamCode/src/main/java') {
    include '**/*.kt'; exclude '**/opmodes/Auto.kt', '**/opmodes/ShooterTuning.kt'
}
def kotlinOutput = layout.buildDirectory.dir('classes/kotlin/biobuzz')
tasks.register('compileKotlin', JavaExec) {
    dependsOn 'compileJava'
    classpath = configurations.kotlinCompiler
    mainClass = 'org.jetbrains.kotlin.cli.jvm.K2JVMCompiler'
    inputs.files(kotlinFiles, sourceSets.main.compileClasspath, sourceSets.main.output.classesDirs)
    outputs.dir(kotlinOutput)
    doFirst {
        delete kotlinOutput
        kotlinOutput.get().asFile.mkdirs()
        args = ['-no-stdlib', '-no-reflect', '-jvm-target', '11', '-classpath',
                (sourceSets.main.compileClasspath + sourceSets.main.output.classesDirs).asPath,
                '-d', kotlinOutput.get().asFile.absolutePath] + kotlinFiles.files.collect { it.absolutePath }
    }
}
tasks.named('classes') { dependsOn 'compileKotlin' }
sourceSets.main.runtimeClasspath += files(kotlinOutput)
tasks.named('jar') { dependsOn 'compileKotlin'; from kotlinOutput }
tasks.register('writeClasspath') {
    dependsOn 'classes', ':sdk:jar', ':runtime:jar'
    doLast { file('build/classpath.txt').text = sourceSets.main.runtimeClasspath.asPath }
}
tasks.register('run', JavaExec) {
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ftcsim.jvm.DesktopSdk'
    systemProperty 'ftcsim.jvm', 'true'
    args '--config', file('robot.json').absolutePath,
         '--opmode', 'org.firstinspires.ftc.teamcode.opmodes.Tele'
}
