plugins { id 'base' }
version = '0.1.0'

tasks.named('build') { dependsOn ':sdk:build', ':simulator:build' }
tasks.named('check') { dependsOn ':sdk:check', ':simulator:check' }
tasks.named('clean') { dependsOn ':sdk:clean', ':simulator:clean' }
tasks.register('packageAll', Sync) {
    group = 'distribution'
    description = 'Package the standalone JVM SDK and runnable simulator distributions.'
    dependsOn ':sdk:distZip', ':simulator:distZip'
    from('sdk/jvm/build/distributions') { include 'ftc-sdk-jvm-*.zip' }
    from('simulator/build/distributions') { include 'ftcsim-*.zip' }
    into layout.buildDirectory.dir('distributions')
}
